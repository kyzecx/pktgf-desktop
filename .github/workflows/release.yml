name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只构建、不发布'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  # 同一个 tag 重复发布时先清掉旧 Release，避免残留旧架构/旧资源的安装包。
  # 历史上出现过同 tag 两个 Release（各平台各自 publish），所以按 id 全部删除。
  cleanup:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && github.event.inputs.dry_run != 'true'
    permissions:
      contents: write
    steps:
      - name: Delete existing releases for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ['GH_TOKEN']
          repo = os.environ['GITHUB_REPOSITORY']
          tag = os.environ['GITHUB_REF_NAME']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          request = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/releases?per_page=100',
              headers=headers,
          )
          with urllib.request.urlopen(request) as response:
              releases = json.load(response)

          for release in releases:
              if release['tag_name'] != tag:
                  continue
              print(f"deleting release {release['id']}")
              delete = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/releases/{release['id']}",
                  headers=headers,
                  method='DELETE',
              )
              urllib.request.urlopen(delete).close()
          PY

  build:
    needs: cleanup
    strategy:
      fail-fast: false
      # 串行构建，避免多个平台同时抢资源；发布统一交给 publish job。
      max-parallel: 1
      matrix:
        include:
          # 单台 macOS 同时构建 arm64/x64，避免两个 macOS runner 排队导致发布卡住。
          - os: macos-15
            target: mac
            artifact: mac
            args: '--mac --arm64 --x64'
          - os: windows-latest
            target: win
            artifact: win
            args: '--win --x64'
          - os: ubuntu-22.04
            target: linux
            artifact: linux
            args: '--linux --x64'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # tag 是版本号的唯一来源：v0.3.0 → package.json 0.3.0
      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build renderer / main / preload
        run: npx electron-vite build

      # 只打包，不发布。三个平台各发一次 release 会把资产拆散。
      - name: Package
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # 无代码签名证书：显式关闭签名，避免 CI 卡在找不到证书
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: pktgf-desktop-${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.yml
          if-no-files-found: ignore

  # 所有平台构建完成后，一次性创建 Release 并上传全部资产。
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME#v}" \
            --notes-file RELEASE_NOTES.md \
            --latest
