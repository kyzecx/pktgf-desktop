name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只构建、不发布'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  # 同一个 tag 重复发布时先清掉旧 Release，避免残留旧架构/旧资源的安装包。
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete existing release for this tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --yes || true

  build:
    needs: cleanup
    strategy:
      fail-fast: false
      matrix:
        include:
          # 单台 macOS 同时构建 arm64/x64，避免两个 macOS runner 排队导致发布卡住。
          - os: macos-15
            target: mac
            artifact: mac
            args: '--mac --arm64 --x64'
          - os: windows-latest
            target: win
            artifact: win
            args: '--win --x64'
          - os: ubuntu-22.04
            target: linux
            artifact: linux
            args: '--linux --x64'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # tag 是版本号的唯一来源：v0.3.0 → package.json 0.3.0
      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build renderer / main / preload
        run: npx electron-vite build

      - name: Package
        run: npx electron-builder ${{ matrix.args }} --publish ${{ (startsWith(github.ref, 'refs/tags/v') && github.event.inputs.dry_run != 'true') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 无代码签名证书：显式关闭签名，避免 CI 卡在找不到证书
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: pktgf-desktop-${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.yml
          if-no-files-found: ignore
  release-notes:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Update release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --notes-file RELEASE_NOTES.md
