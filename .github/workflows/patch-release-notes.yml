name: Patch release notes

# 一次性工作流：补齐 v0.4.1 的 GitHub Release 说明。
# 手动删除本文件即可，不会影响后续发布。

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-release-notes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update v0.4.1 release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ['GH_TOKEN']
          repo = os.environ['GITHUB_REPOSITORY']
          tag = 'v0.4.1'
          with open('RELEASE_NOTES.md', encoding='utf-8') as handle:
              body = handle.read()

          request = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/releases/tags/{tag}',
              data=json.dumps({'body': body}).encode('utf-8'),
              headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
              method='PATCH',
          )
          try:
              with urllib.request.urlopen(request) as response:
                  print('release notes updated:', response.status)
          except urllib.error.HTTPError as error:
              print('HTTP', error.code, error.read().decode('utf-8', 'replace'))
              raise
          PY
